<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREA | Controle Financeiro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f6fa;
      --white: #ffffff;
      --dark: #191c29;
      --text: #252936;
      --muted: #7d8494;
      --border: #e6e8ef;
      --purple: #6c5ce7;
      --purple-dark: #5143be;
      --green: #20a879;
      --red: #e55c70;
      --yellow: #e3a82d;
      --blue: #4e8fe7;
      --shadow: 0 10px 30px rgba(28, 36, 70, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: var(--dark);
      color: white;
      padding: 30px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      padding: 0 14px 35px;
    }

    .brand h1 {
      margin: 0 0 8px;
      letter-spacing: 7px;
      font-size: 26px;
    }

    .brand p {
      margin: 0;
      color: #a9aec1;
      font-size: 11px;
    }

    .menu-list {
      display: grid;
      gap: 8px;
    }

    .menu {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #aeb3c7;
      padding: 14px;
      text-align: left;
      transition: .2s;
    }

    .menu:hover,
    .menu.active {
      background: #2d3048;
      color: white;
    }

    .menu span {
      display: inline-block;
      width: 30px;
    }

    .profile {
      border: 1px solid #3a3d53;
      border-radius: 14px;
      padding: 15px;
      color: #aeb3c7;
    }

    .profile p {
      margin: 0 0 5px;
      font-size: 11px;
    }

    .profile strong {
      color: white;
    }

    .content {
      width: min(1250px, 100%);
      margin: auto;
      padding: 30px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .topbar h2 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input,
    .select {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    .input:focus,
    .select:focus {
      border-color: var(--purple);
    }

    .bell {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      padding: 10px 13px;
      font-size: 17px;
    }

    .page {
      display: grid;
      gap: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .card,
    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .metric {
      position: relative;
      min-height: 115px;
    }

    .metric small {
      display: block;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .metric strong {
      font-size: 23px;
    }

    .metric .icon {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 24px;
      opacity: .65;
    }

    .green {
      color: var(--green);
    }

    .red {
      color: var(--red);
    }

    .purple {
      color: var(--purple);
    }

    .yellow {
      color: var(--yellow);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 20px;
    }

    .panel h3 {
      margin: 0 0 18px;
      font-size: 15px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .muted {
      color: var(--muted);
    }

    .alert {
      padding: 14px;
      margin: 9px 0;
      border-radius: 11px;
      background: #effaf5;
      color: #227d61;
    }

    .alert.warning {
      background: #fff7e4;
      color: #936911;
    }

    .alert.danger {
      background: #fff0f2;
      color: #b13d52;
    }

    .chart {
      height: 190px;
      display: flex;
      align-items: end;
      gap: 18px;
      border-bottom: 1px solid var(--border);
      padding: 10px 10px 0;
    }

    .bar-box {
      height: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: center;
      gap: 8px;
    }

    .bar {
      width: min(45px, 80%);
      min-height: 5px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(var(--purple), #a298ff);
    }

    .bar.expense {
      background: linear-gradient(var(--red), #f6a1ad);
    }

    .bar-box small {
      color: var(--muted);
      font-size: 10px;
    }

    .donut {
      width: 175px;
      height: 175px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: conic-gradient(
        #765ce3 0 48%,
        #f08b9b 48% 67%,
        #e6b242 67% 79%,
        #36b98b 79% 91%,
        #6499e5 91% 100%
      );
      position: relative;
    }

    .donut::after {
      content: "";
      width: 82px;
      height: 82px;
      background: white;
      border-radius: 50%;
      position: absolute;
      inset: 46px;
    }

    .legend {
      display: grid;
      gap: 9px;
    }

    .legend span {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 7px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      background: var(--purple);
      color: white;
      transition: .2s;
    }

    .btn:hover {
      background: var(--purple-dark);
    }

    .btn.secondary {
      background: #efefff;
      color: var(--purple);
    }

    .btn.danger {
      background: #fff0f2;
      color: var(--red);
    }

    .form {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr auto;
      gap: 9px;
      margin-bottom: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 13px 7px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    .table th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .table td {
      font-size: 13px;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: var(--muted);
    }

    .limit {
      margin: 19px 0;
    }

    .limit-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: #edf0f5;
    }

    .progress i {
      display: block;
      height: 100%;
      border-radius: 20px;
      background: var(--green);
    }

    .progress i.over {
      background: var(--red);
    }

    .goal {
      display: grid;
      grid-template-columns: 85px 1fr auto;
      align-items: center;
      gap: 15px;
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
    }

    .goal-image {
      height: 72px;
      border-radius: 12px;
      background: linear-gradient(135deg, #eeecff, #bcb3ff);
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    .goal h4 {
      margin: 0 0 7px;
    }

    .goal p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .toast {
      display: none;
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      padding: 14px 18px;
      border-radius: 10px;
      background: #20232f;
      color: white;
      box-shadow: var(--shadow);
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 950px) {
      .sidebar {
        width: 210px;
      }

      .content {
        padding: 24px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .form {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .app {
        display: block;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
        padding: 18px;
      }

      .brand {
        padding: 0 8px 18px;
      }

      .menu-list {
        display: flex;
        overflow-x: auto;
      }

      .menu {
        white-space: nowrap;
        width: auto;
        padding: 10px;
      }

      .profile {
        display: none;
      }

      .content {
        padding: 18px 13px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions,
      .select {
        width: 100%;
      }

      .cards {
        gap: 10px;
      }

      .card,
      .panel {
        padding: 15px;
      }

      .metric {
        min-height: 100px;
      }

      .metric strong {
        font-size: 17px;
      }

      .form {
        grid-template-columns: 1fr 1fr;
      }

      .form .input:first-child {
        grid-column: 1 / -1;
      }

      .goal {
        grid-template-columns: 62px 1fr;
      }

      .goal .btn {
        grid-column: 2;
      }

      .goal-image {
        height: 62px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <h1>AUREA</h1>
          <p>Sua vida financeira organizada</p>
        </div>

        <nav class="menu-list">
          <button class="menu active" data-page="dashboard">
            <span>⌂</span>Dashboard
          </button>

          <button class="menu" data-page="financeiro">
            <span>💳</span>Meu Financeiro
          </button>

          <button class="menu" data-page="investimentos">
            <span>📈</span>Investimentos
          </button>

          <button class="menu" data-page="limites">
            <span>🎯</span>Limites
          </button>

          <button class="menu" data-page="desejos">
            <span>✨</span>Desejos
          </button>
        </nav>
      </div>

      <div class="profile">
        <p>Plano</p>
        <strong>AUREA Premium</strong>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Acompanhe sua evolução financeira</p>
        </div>

        <div class="actions">
          <select class="select" id="monthSelect">
            <option>Janeiro 2026</option>
            <option>Fevereiro 2026</option>
            <option>Março 2026</option>
            <option>Abril 2026</option>
            <option selected>Maio 2026</option>
            <option>Junho 2026</option>
            <option>Julho 2026</option>
            <option>Agosto 2026</option>
            <option>Setembro 2026</option>
            <option>Outubro 2026</option>
            <option>Novembro 2026</option>
            <option>Dezembro 2026</option>
          </select>

          <button class="bell" id="notificationButton">🔔</button>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "aurea_financeiro";

    const defaultData = {
      receitas: [
        {
          id: crypto.randomUUID(),
          descricao: "Salário principal",
          categoria: "Salário",
          valor: 6600
        }
      ],

      despesas: [
        {
          id: crypto.randomUUID(),
          descricao: "Aluguel",
          categoria: "Moradia",
          valor: 1300,
          tipo: "Fixo",
          pagamento: "Cartão de débito"
        },
        {
          id: crypto.randomUUID(),
          descricao: "Net Claro",
          categoria: "Internet/Telefone",
          valor: 70,
          tipo: "Fixo",
          pagamento: "Pix"
        },
        {
          id: crypto.randomUUID(),
          descricao: "Academia",
          categoria: "Academia",
          valor: 150,
          tipo: "Fixo",
          pagamento: "Pix"
        },
        {
          id: crypto.randomUUID(),
          descricao: "Curso de inglês",
          categoria: "Educação",
          valor: 70,
          tipo: "Fixo",
          pagamento: "Pix"
        },
        {
          id: crypto.randomUUID(),
          descricao: "Água",
          categoria: "Contas da Casa",
          valor: 45,
          tipo: "Fixo",
          pagamento: "Pix"
        },
        {
          id: crypto.randomUUID(),
          descricao: "Transporte",
          categoria: "Transporte",
          valor: 50,
          tipo: "Variável",
          pagamento: "Pix"
        },
        {
          id: crypto.randomUUID(),
          descricao: "iFood",
          categoria: "Delivery",
          valor: 65,
          tipo: "Variável",
          pagamento: "Cartão"
        }
      ],

      dividas: 1250,
      investimentos: 31500,

      limites: [
        { categoria: "Restaurante", gasto: 180, limite: 150 },
        { categoria: "Transporte", gasto: 50, limite: 250 },
        { categoria: "Vestuário", gasto: 0, limite: 300 },
        { categoria: "Beleza", gasto: 0, limite: 250 },
        { categoria: "Delivery", gasto: 65, limite: 180 },
        { categoria: "Pets", gasto: 120, limite: 200 }
      ],

      desejos: [
        {
          id: crypto.randomUUID(),
          nome: "Apple 2025 iPad Wi-Fi, 128 GB",
          valor: 3399,
          guardado: 1200,
          icone: "📱"
        }
      ]
    };

    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
    let currentPage = "dashboard";

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function money(value) {
      return Number(value || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function number(value) {
      return Number(value || 0).toLocaleString("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function totalReceitas() {
      return data.receitas.reduce((total, item) => total + Number(item.valor), 0);
    }

    function totalDespesas() {
      return data.despesas.reduce((total, item) => total + Number(item.valor), 0);
    }

    function saldo() {
      return totalReceitas() - totalDespesas();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function card(title, value, color, icon) {
      return `
        <div class="card metric">
          <small>${title}</small>
          <strong class="${color}">${typeof value === "number" ? money(value) : value}</strong>
          <span class="icon">${icon}</span>
        </div>
      `;
    }

    function summaryCards() {
      return `
        <div class="cards">
          ${card("Receitas", totalReceitas(), "green", "💰")}
          ${card("Despesas", totalDespesas(), "red", "↘")}
          ${card("Saldo do mês", saldo(), saldo() >= 0 ? "green" : "red", "↗")}
          ${card("Investimentos", data.investimentos, "purple", "📈")}
        </div>
      `;
    }

    function dashboardPage() {
      const economy = totalReceitas()
        ? ((saldo() / totalReceitas()) * 100).toFixed(1)
        : 0;

      const categories = {};

      data.despesas.forEach(item => {
        categories[item.categoria] =
          (categories[item.categoria] || 0) + Number(item.valor);
      });

      const categoryRows = Object.entries(categories)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6)
        .map(([category, value]) => `
          <div class="legend">
            <span>
              <label>
                <i class="dot" style="background:#765ce3"></i>
                ${category}
              </label>
              ${money(value)}
            </span>
          </div>
        `)
        .join("");

      return `
        <div class="page">
          ${summaryCards()}

          <div class="grid-2">
            <div class="panel">
              <h3>🔔 Alertas inteligentes</h3>

              <div class="alert warning">
                📅 3 contas vencem nos próximos dias: Netflix, Spotify e Água.
              </div>

              <div class="alert">
                ✅ Você está poupando ${number(economy)}% da sua renda neste mês.
              </div>

              ${
                data.limites.some(item => item.gasto > item.limite)
                  ? `<div class="alert danger">
                      ⚠️ Existem categorias acima do limite definido.
                    </div>`
                  : ""
              }
            </div>

            <div class="panel">
              <h3>📊 Gastos por categoria</h3>
              <div class="donut"></div>
              ${categoryRows || `<div class="empty">Nenhuma despesa registrada.</div>`}
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Receitas vs. despesas</h3>
              <span class="muted">Maio 2026</span>
            </div>

            <div class="chart">
              <div class="bar-box">
                <div class="bar" style="height: 90%"></div>
                <small>Receitas</small>
              </div>

              <div class="bar-box">
                <div class="bar expense"
                  style="height:${Math.max(
                    6,
                    Math.min(90, (totalDespesas() / totalReceitas()) * 90)
                  )}%">
                </div>
                <small>Despesas</small>
              </div>

              <div class="bar-box">
                <div class="bar" style="height:${Math.max(
                  6,
                  Math.min(90, (saldo() / totalReceitas()) * 90)
                )}%"></div>
                <small>Saldo</small>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function financeiroPage() {
      const receitas = data.receitas.map(item => `
        <tr>
          <td>${item.descricao}</td>
          <td>${item.categoria}</td>
          <td class="green">${money(item.valor)}</td>
          <td>
            <button class="btn danger delete-receita" data-id="${item.id}">
              Excluir
            </button>
          </td>
        </tr>
      `).join("");

      const despesas = data.despesas.map(item => `
        <tr>
          <td>${item.descricao}</td>
          <td>${item.categoria}</td>
          <td>${item.tipo}</td>
          <td>${item.pagamento || "-"}</td>
          <td class="red">${money(item.valor)}</td>
          <td>
            <button class="btn danger delete-despesa" data-id="${item.id}">
              Excluir
            </button>
          </td>
        </tr>
      `).join("");

      return `
        <div class="page">
          ${summaryCards()}

          <div class="panel">
            <h3>Adicionar lançamento</h3>

            <form class="form" id="financeForm">
              <input
                class="input"
                name="descricao"
                placeholder="Descrição"
                required
              >

              <input
                class="input"
                name="valor"
                type="number"
                min="0"
                step="0.01"
                placeholder="Valor"
                required
              >

              <select class="select" name="tipo">
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
              </select>

              <select class="select" name="categoria">
                <option>Salário</option>
                <option>Moradia</option>
                <option>Alimentação</option>
                <option>Transporte</option>
                <option>Educação</option>
                <option>Delivery</option>
                <option>Saúde</option>
                <option>Lazer</option>
                <option>Outros</option>
              </select>

              <button class="btn" type="submit">Adicionar</button>
            </form>

            <h3>Receitas</h3>

            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Ação</th>
                  </tr>
                </thead>

                <tbody>
                  ${receitas || `
                    <tr>
                      <td colspan="4" class="empty">
                        Nenhuma receita cadastrada.
                      </td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>

          <div class="panel">
            <h3>Despesas, custos fixos e variáveis</h3>

            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Tipo</th>
                    <th>Pagamento</th>
                    <th>Valor</th>
                    <th>Ação</th>
                  </tr>
                </thead>

                <tbody>
                  ${despesas || `
                    <tr>
                      <td colspan="6" class="empty">
                        Nenhuma despesa cadastrada.
                      </td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>

            <div class="panel-header">
              <strong>Total mensal de despesas</strong>

    function limitesPage() {
      const rows = data.limites.map(item => {
        const percentage = item.limite > 0
          ? Math.min(100, (item.gasto / item.limite) * 100)
          : 0;

        const over = item.gasto > item.limite;

        return `
          <div class="limit">
            <div class="limit-line">
              <span>${item.categoria}</span>

              <span>
                ${money(item.gasto)} / ${money(item.limite)}
                <button
                  class="btn secondary edit-limit"
                  data-category="${item.categoria}">
                  Editar
                </button>
              </span>
            </div>

            <div class="progress">
              <i class="${over ? "over" : ""}" style="width:${percentage}%"></i>
            </div>

            ${
              over
                ? `<small class="red">
                    Limite excedido em ${money(item.gasto - item.limite)}
                  </small>`
                : ""
            }
          </div>
        `;
      }).join("");

      return `
        <div class="page">
          ${summaryCards()}

          <div class="panel">
            <h3>🎯 Limites por categoria</h3>
            ${rows}
          </div>
        </div>
      `;
    }

    function desejosPage() {
      const total = data.desejos.reduce((sum, item) => sum + item.valor, 0);
      const saved = data.desejos.reduce((sum, item) => sum + item.guardado, 0);

      const goals = data.desejos.map(item => {
        const percentage = Math.min(100, (item.guardado / item.valor) * 100);

        return `
          <div class="goal">
            <div class="goal-image">${item.icone}</div>

            <div>
              <h4>${item.nome}</h4>
              <p>Valor total: ${money(item.valor)}</p>

              <div class="progress">
                <i style="width:${percentage}%"></i>
              </div>

              <p>
                Guardado: ${money(item.guardado)}
                · Falta: ${money(item.valor - item.guardado)}
              </p>
            </div>

            <button
              class="btn secondary update-goal"
              data-id="${item.id}">
              Atualizar
            </button>
          </div>
        `;
      }).join("");

      return `
        <div class="page">
          ${summaryCards()}

          <div class="cards">
            ${card("Total de desejos", total, "purple", "♡")}
            ${card("Já guardado", saved, "green", "✓")}
            ${card("Falta guardar", total - saved, "yellow", "🛒")}
            ${card("Tempo estimado", "5 meses", "purple", "🗓")}
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>✨ Seus desejos</h3>
              <button class="btn" id="goalButton">
                Adicionar desejo
              </button>
            </div>

            ${goals || `
              <div class="empty">
                Nenhum desejo cadastrado.
              </div>
            `}
          </div>
        </div>
      `;
    }

      currentPage = page;

      document.getElementById("pageTitle").textContent =
        pages[page].title;

      document.getElementById("pageSubtitle").textContent =
        pages[page].subtitle;

      document.getElementById("content").innerHTML =
        pages[page].render();

      document.querySelectorAll(".menu").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.page === page
        );
      });

      bindEvents();
    }

        button.onclick = () => render(button.dataset.page);
      });

      const financeForm = document.getElementById("financeForm");

      if (financeForm) {
        financeForm.onsubmit = event => {
          event.preventDefault();

          const form = new FormData(financeForm);
          const valor = Number(form.get("valor"));

          if (!valor || valor <= 0) {
            showToast("Informe um valor válido.");
            return;
          }

          const tipo = form.get("tipo");

          if (tipo === "receita") {
            data.receitas.push({
              id: crypto.randomUUID(),
              descricao: form.get("descricao"),
              categoria: form.get("categoria"),
              valor
            });
          } else {
            data.despesas.push({
              id: crypto.randomUUID(),
              descricao: form.get("descricao"),
              categoria: form.get("categoria"),
              valor,
              tipo: "Variável",
