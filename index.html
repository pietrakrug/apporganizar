<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organiza | Controle financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles/global.css" />
</head>
<body>
<div class="app-shell">
<header class="topbar container section">
<div>
<p class="label">Financas</p>
<h1 class="page-title">Organiza</h1>
<p class="text-muted">Controle financeiro pessoal com clareza visual.</p>
</div>
<div class="topbar-actions">
<div class="month-chip" id="monthChip">Mes atual</div>
<button class="primary-button" id="openFormBtn" type="button">+ Nova transacao</button>
</div>
</header>

<main class="container section dashboard-grid">

<section class="card" id="formCard" style="display:none;">
<div class="card-header"><p class="card-title">Nova transacao</p></div>
<form id="transactionForm" class="card-body">
<input type="text" id="descInput" placeholder="Descricao" required />
<input type="number" id="valueInput" placeholder="Valor" step="0.01" required />
<select id="typeInput">
<option value="receita">Receita</option>
<option value="despesa">Despesa</option>
</select>
<input type="text" id="categoryInput" placeholder="Categoria" />
<input type="date" id="dateInput" required />
<div style="display:flex; gap:10px;">
<button type="submit" class="primary-button">Salvar</button>
<button type="button" id="cancelFormBtn" class="ghost-button">Cancelar</button>
</div>
</form>
</section>

<section class="summary-grid">
<article class="card">
<div class="card-body">
<span class="label">Receitas</span>
<strong class="metric-value" id="totalIncome">R$ 0,00</strong>
</div>
</article>
<article class="card">
<div class="card-body">
<span class="label">Despesas</span>
<strong class="metric-value danger" id="totalExpense">R$ 0,00</strong>
</div>
</article>
<article class="card card-success">
<div class="card-body">
<span class="label">Saldo do mes</span>
<strong class="metric-value success" id="totalBalance">R$ 0,00</strong>
</div>
</article>
</section>

<section class="card">
<div class="card-header"><p class="card-title">Transacoes</p></div>
<div class="card-body" id="transactionList">
<p class="text-muted">Nenhuma transacao cadastrada ainda.</p>
</div>
</section>

</main>
</div>
<script src="./main.js"></script>
</body>
</html>
