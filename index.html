<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREA | Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/global.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">
<h2>AUREA</h2>
<p>Sua vida financeira organizada</p>
</div>
<nav>
<button class="menu active" data-page="dashboard"><span>H</span>Dashboard</button>
<button class="menu" data-page="financeiro"><span>$</span>Meu Financeiro</button>
<button class="menu" data-page="investimentos"><span>I</span>Investimentos</button>
<button class="menu" data-page="limites"><span>L</span>Limites</button>
<button class="menu" data-page="desejos"><span>D</span>Desejos</button>
<button class="menu" data-page="saude"><span>S</span>Saude Financeira</button>
</nav>
<div class="sidebar-footer">
<p>Controle inteligente</p>
<strong>AUREA Premium</strong>
</div>
</aside>
<main class="main">
<header class="topbar">
<div>
<h1 id="tituloPagina">Dashboard</h1>
<p id="subtituloPagina">Acompanhe sua evolucao financeira</p>
</div>
<div class="header-actions">
<select id="mesSelecionado">
<option>Janeiro</option>
<option>Fevereiro</option>
<option>Marco</option>
<option>Abril</option>
<option>Maio</option>
<option>Junho</option>
<option>Julho</option>
<option selected>Agosto</option>
<option>Setembro</option>
<option>Outubro</option>
<option>Novembro</option>
<option>Dezembro</option>
</select>
<button class="notification">Alertas</button>
</div>
</header>
<section id="conteudo"></section>
</main>
</div>
<script src="main.js"></script>
</body>
</html>
